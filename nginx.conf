events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost pqr.info;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name pqr.info;

        ssl_certificate /etc/nginx/certs/origin_ca.pem;
        ssl_certificate_key /etc/nginx/certs/origin_ca.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Static HUD Assets
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /web/ {
            alias /usr/share/nginx/html/;
        }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name imagefx.pqr.info;

        ssl_certificate /etc/nginx/certs/origin_ca.pem;
        ssl_certificate_key /etc/nginx/certs/origin_ca.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Docker internal DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $imagefx_endpoint http://imagefx:80;

        location / {
            proxy_pass $imagefx_endpoint;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
